<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baluka Soft | Official App Studio & Beta Testing Portal</title>
    <meta name="description" content="Baluka Soft official website - Showcase of published mobile applications and exclusive internal beta testing signup portal for new apps." />
    
    <!-- Google Fonts: Tiro Bangla, Hind Siliguri, Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA & Mobile Add to Home Screen Support -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00e676" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Baluka Soft" />
    <link rel="apple-touch-icon" href="./assets/logo.png" />
    <script type="module" crossorigin src="./assets/index-B3cXMm2i.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Shqqw9yJ.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Register Service Worker for PWA App Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
            .catch((err) => console.log('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
